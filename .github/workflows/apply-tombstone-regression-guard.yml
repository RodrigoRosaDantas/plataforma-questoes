name: Proteger tombstones de progresso

on:
  push:
    paths:
      - '.github/workflows/apply-tombstone-regression-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inserir gate de regressão
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='scripts/check-regressions.mjs';
          let s=fs.readFileSync(path,'utf8');
          const anchor="if(app.includes('Number(value.dueAt)||0,Number(value.removedAt)||0'))throw new Error('dueAt voltou a ser tratado como timestamp principal de conflito.');";
          if(!s.includes(anchor))throw new Error('Âncora de revisão não encontrada.');
          if(s.includes('Proteção de tombstones de marcações/anotações ausente')){console.log('Gate já existe.');process.exit(0);}
          const block=`\n\n// Tombstones multiaparelho: remoções precisam vencer versões antigas no merge.\nfor(const marker of [\n  'Number(value.updatedAt)||0',\n  'Number(value.removedAt)||0',\n  'merged[id]=entryTime(local[id])>=entryTime(remote[id])?local[id]:remote[id]',\n  'p.marked[q.id]=current&&!current.removed?{removed:true,removedAt:Date.now()}:{at:Date.now()}',\n  'p.notes[q.id]={text,updatedAt:now}'\n]) requireMarker(app,marker,'Proteção de tombstones de marcações/anotações ausente');\n`;
          s=s.replace(anchor,anchor+block);
          fs.writeFileSync(path,s);
          NODE
      - name: Validar plataforma
        run: |
          node --check scripts/check-regressions.mjs
          npm run validate
      - name: Commitar gate
        run: |
          if git diff --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/check-regressions.mjs
          git commit -m 'test: proteger tombstones de progresso'
          git fetch origin main
          git rebase origin/main
          git push
