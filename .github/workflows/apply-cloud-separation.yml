name: Separar nuvem e edital canônico

on:
  push:
    paths:
      - '.github/workflows/apply-cloud-separation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar patch seguro
        run: node scripts/apply-cloud-separation.mjs
      - name: Validar código
        run: |
          node --check assets/cloud-progress.js
          node --check assets/canonical-editais.js
          node --check scripts/check-regressions.mjs
          npm run validate
      - name: Commitar correção
        run: |
          if git diff --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/cloud-progress.js assets/canonical-editais.js scripts/check-regressions.mjs service-worker.js
          git commit -m 'refactor: separar identidade de nuvem do edital canônico'
          git push
