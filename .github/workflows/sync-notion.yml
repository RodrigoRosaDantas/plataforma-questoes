name: Sincronizar Banco Mestre do Notion
# Disparado para publicar auditorias editoriais do Banco Mestre.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-notion.yml"
      - "scripts/sync-notion.mjs"
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gerar release do Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
        run: npm run sync:notion
      - name: Validar release
        run: npm run validate
      - name: Commitar apenas dados derivados
        run: |
          if git diff --quiet -- data/questions.json data/metadata.json; then
            echo "Sem alterações."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/questions.json data/metadata.json
          git commit -m "data: sincronizar Banco Mestre do Notion"
          git push
