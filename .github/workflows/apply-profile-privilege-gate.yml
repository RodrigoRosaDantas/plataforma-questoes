name: Proteger privilégios do perfil

on:
  push:
    paths:
      - '.github/workflows/apply-profile-privilege-gate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar gate seguro
        run: node scripts/apply-profile-privilege-gate.mjs
      - name: Validar plataforma
        run: |
          node --check scripts/check-regressions.mjs
          npm run validate
      - name: Commitar proteção
        run: |
          if git diff --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/check-regressions.mjs
          git commit -m 'test: proteger grants por coluna do perfil'
          git fetch origin main
          git rebase origin/main
          git push
